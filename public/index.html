<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSUBEB/PIMU Needs Assessment Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --lagos-red: #DC2626;
            --lagos-blue: #1E40AF;
            --lagos-yellow: #FACC15;
            --lagos-green: #16A34A;
            --lagos-white: #FFFFFF;
            --lagos-navy: #1E3A8A;
            --lagos-dark-gray: #64748B;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--lagos-blue);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            background: var(--lagos-navy);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--lagos-white);
            position: relative;
            border-left: 8px solid var(--lagos-red);
        }

        .header .logo {
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: var(--lagos-white);
        }

        .header .logo img {
            height: 40px;
            width: 40px;
            margin-right: 12px;
            background: var(--lagos-white);
            border-radius: 50%;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--lagos-green);
            box-shadow: 0 0 10px rgba(22, 163, 74, 0.5);
            border: 2px solid var(--lagos-white);
        }

        .status-dot.offline {
            background: var(--lagos-red);
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
        }

        .main-content {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
            height: calc(100vh - 140px);
            position: relative;
        }

        .sidebar {
            background: var(--lagos-navy);
            border-radius: 15px;
            padding: 20px;
            color: var(--lagos-white);
            position: relative;
            border-left: 6px solid var(--lagos-red);
        }

        .nav-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .nav-item:hover {
            background: var(--lagos-green);
            border-left-color: var(--lagos-yellow);
            color: var(--lagos-white);
            transform: translateX(5px);
        }

        .nav-item.active {
            background: var(--lagos-red);
            color: var(--lagos-white);
            font-weight: 600;
            border-left-color: var(--lagos-yellow);
        }

        .content-area {
            background: var(--lagos-white);
            border-radius: 15px;
            padding: 30px;
            overflow-y: auto;
            position: relative;
            border-top: 4px solid var(--lagos-blue);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            color: var(--lagos-white);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            position: relative;
            border: 3px solid var(--lagos-white);
        }

        .stat-card:nth-child(1) {
            background: var(--lagos-red);
        }

        .stat-card:nth-child(2) {
            background: var(--lagos-green);
        }

        .stat-card:nth-child(3) {
            background: var(--lagos-yellow);
            color: var(--lagos-navy);
        }

        .stat-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--lagos-blue);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 1rem;
            opacity: 0.9;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--lagos-white);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        .data-table th {
            background: var(--lagos-blue);
            color: var(--lagos-white);
            font-weight: 600;
            position: relative;
        }

        .data-table th::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--lagos-red);
        }

        .sync-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .sync-status.synced {
            background: var(--lagos-green);
            color: var(--lagos-white);
        }

        .sync-status.pending {
            background: var(--lagos-yellow);
            color: var(--lagos-navy);
        }

        .btn {
            padding: 8px 16px;
            background: var(--lagos-blue);
            color: var(--lagos-white);
            border: 2px solid var(--lagos-red);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: var(--lagos-red);
            border-color: var(--lagos-blue);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.3);
        }

        .btn-secondary {
            background: var(--lagos-green);
            border-color: var(--lagos-yellow);
        }

        .btn-secondary:hover {
            background: var(--lagos-yellow);
            border-color: var(--lagos-green);
            color: var(--lagos-navy);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: none;
            border: none;
            cursor: pointer;
            margin-left: 16px;
        }

        .hamburger span {
            display: block;
            width: 28px;
            height: 4px;
            margin: 4px 0;
            background: var(--lagos-white);
            border-radius: 2px;
            transition: 0.3s;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }

            .main-content {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .header .logo {
                font-size: 18px;
            }

            .status .btn {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23DC2626'/%3E%3Ctext x='50' y='60' text-anchor='middle' fill='white' font-size='40' font-weight='bold'%3ELS%3C/text%3E%3C/svg%3E" alt="Lagos State Logo">
                LSUBEB/PIMU NEEDS ASSESSMENT TOOL
            </div>
            <button class="hamburger" onclick="toggleMobileSidebar()" aria-label="Open navigation">
                <span></span><span></span><span></span>
            </button>
            <div class="status">
                <div class="status-dot"></div>
                <span>Online</span>
                <button class="btn btn-secondary">Logout</button>
            </div>
        </div>

        <div class="main-content">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="nav-item active" onclick="showSurvey('dashboard')">📊 Dashboard</div>
                <div class="nav-item" onclick="showSurvey('silnat')">📝 INFRA & LEADERSHIP</div>
                <div class="nav-item" onclick="showSurvey('tcmats')">👩‍🏫 TEACHER CLASSROOM MGT</div>
                <div class="nav-item" onclick="showSurvey('lori')">📖 LESSON OBSERVATION</div>
                <div class="nav-item" onclick="showSurvey('voices')">🎓 LEARNER VOICES</div>
            </div>

            <!-- Main Content Area -->
            <div class="content-area">
                <div id="dashboardSection">
                    <h2 style="margin-bottom: 30px; color: var(--lagos-navy);">Dashboard</h2>

                    <!-- Statistics Cards -->
                    <div class="dashboard-grid">
                        <div class="stat-card">
                            <div class="stat-number" id="totalAudits">0</div>
                            <div class="stat-label">Total Audits</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" id="pendingSync">0</div>
                            <div class="stat-label">Pending Sync</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" id="completedToday">0</div>
                            <div class="stat-label">Completed Today</div>
                        </div>
                    </div>

                    <!-- Recent Audits Table -->
                    <h3 style="margin-bottom: 20px; color: var(--lagos-navy);">Recent Audits</h3>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>School Name</th>
                                <th>Local Government</th>
                                <th>Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="recentAuditsTable">
                        </tbody>
                    </table>

                    <!-- Action Buttons -->
                    <div style="margin-top: 30px; display: flex; gap: 15px; flex-wrap: wrap;">
                        <button class="btn">📤 Export Data</button>
                        <button class="btn btn-secondary">📁 Upload CSV</button>
                        <button class="btn">🔄 Sync Data</button>
                    </div>
                </div>
                <div id="silnatSection" class="hidden"></div>
                <div id="tcmatsSection" class="hidden"></div>
                <div id="loriSection" class="hidden"></div>
                <div id="voicesSection" class="hidden"></div>
            </div>
        </div>
    </div>

    <script>
        function toggleMobileSidebar() {
            // Mobile sidebar toggle functionality would go here
            console.log('Toggle mobile sidebar');
        }

        function showSurvey(survey) {
            document.getElementById('dashboardSection').classList.add('hidden');
            ['silnat','tcmats','lori','voices'].forEach(s => {
                const section = document.getElementById(s + 'Section');
                if (section) {
                    section.classList.add('hidden');
                }
            });

            if (survey === 'dashboard') {
                document.getElementById('dashboardSection').classList.remove('hidden');
            } else {
                const targetSection = document.getElementById(survey + 'Section');
                if (targetSection) {
                    targetSection.classList.remove('hidden');
                }
            }
        }

        // Add some interactivity to navigation items
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
